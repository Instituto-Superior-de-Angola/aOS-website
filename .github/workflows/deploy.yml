name: Publicação em Produção

# Publica o website em produção no Vercel.
#
# Dispara quando a "Verificação Contínua" termina com sucesso no ramo main —
# ou seja, imediatamente após o merge de um Pull Request. O gatilho por
# workflow_run garante que nunca se publica código que não passou no portão de
# qualidade, sem duplicar aqui os passos de verificação.

on:
  workflow_run:
    workflows: ['Verificação Contínua']
    branches: [main]
    types: [completed]
  # Permite uma republicação manual a partir do separador Actions.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar em produção
    # Em workflow_run, só avança se a verificação tiver passado.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ steps.publicar.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Em workflow_run, o checkout por omissão aponta para o ramo por
          # omissão; fixamos explicitamente o commit que passou na verificação.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar credenciais do Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # O erro nativo do `vercel pull` ("Could not retrieve Project Settings")
          # não distingue um token em falta de um token com âmbito errado. Esta
          # verificação prévia diz exactamente o que está mal.
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Faltam segredos. Defina VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID no repositório."
            exit 1
          fi

          codigo=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")

          case "$codigo" in
            200)
              echo "Credenciais válidas: o token acede ao projecto $VERCEL_PROJECT_ID." ;;
            401)
              echo "::error::VERCEL_TOKEN inválido ou expirado. Tokens OAuth da CLI duram poucas horas — crie um token em https://vercel.com/account/tokens."
              exit 1 ;;
            403)
              echo "::error::O VERCEL_TOKEN não tem acesso ao âmbito $VERCEL_ORG_ID. Recrie o token em https://vercel.com/account/tokens escolhendo no selector Scope a equipa dona do projecto, e não a conta pessoal."
              exit 1 ;;
            404)
              echo "::error::Projecto $VERCEL_PROJECT_ID não encontrado no âmbito $VERCEL_ORG_ID. Confirme os valores em .vercel/repo.json (ou .vercel/project.json) após 'vercel link'."
              exit 1 ;;
            *)
              echo "::error::Resposta inesperada da API do Vercel (HTTP $codigo)."
              exit 1 ;;
          esac

      - name: Instalar a CLI do Vercel
        run: npm install --global vercel@latest

      - name: Obter a configuração de produção do Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilar os artefactos de produção
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar os artefactos pré-compilados
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado em $url" >> "$GITHUB_STEP_SUMMARY"
