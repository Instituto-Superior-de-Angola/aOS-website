name: Publicação em Produção

# Publica o website em produção no Vercel.
#
# Dispara quando a "Verificação Contínua" termina com sucesso no ramo main —
# ou seja, imediatamente após o merge de um Pull Request. O gatilho por
# workflow_run garante que nunca se publica código que não passou no portão de
# qualidade, sem duplicar aqui os passos de verificação.

on:
  workflow_run:
    workflows: ['Verificação Contínua']
    branches: [main]
    types: [completed]
  # Permite uma republicação manual a partir do separador Actions.
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar em produção
    # Em workflow_run, só avança se a verificação tiver passado.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: ${{ steps.publicar.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Em workflow_run, o checkout por omissão aponta para o ramo por
          # omissão; fixamos explicitamente o commit que passou na verificação.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar credenciais do Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # O erro nativo do `vercel pull` ("Could not retrieve Project Settings")
          # não distingue um token em falta de um token com âmbito errado. Esta
          # verificação prévia diz exactamente o que está mal.
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Faltam segredos. Defina VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID no repositório."
            exit 1
          fi

          sonda() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" "$1"
          }

          base=https://api.vercel.com
          utilizador=$(sonda "$base/v2/user")
          equipa=$(sonda "$base/v2/teams/$VERCEL_ORG_ID")
          projecto=$(sonda "$base/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          ambiente=$(sonda "$base/v9/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID")

          echo "Sondas à API do Vercel (o \`vercel pull\` precisa das quatro):"
          echo "  GET /v2/user                    -> $utilizador"
          echo "  GET /v2/teams/<org>             -> $equipa"
          echo "  GET /v9/projects/<projecto>     -> $projecto"
          echo "  GET /v9/projects/<projecto>/env -> $ambiente"

          # Um token restringido a projectos específicos lê o projecto mas não
          # tem contexto de utilizador. A CLI chama /v2/user no arranque, recebe
          # 404 e reporta apenas "Could not retrieve Project Settings".
          if [ "$projecto" = "200" ] && [ "$utilizador" != "200" ]; then
            echo "::error::O VERCEL_TOKEN está restringido a projectos específicos: lê o projecto (200) mas não tem contexto de utilizador (/v2/user -> $utilizador). O 'vercel pull' precisa desse contexto. Recrie o token em https://vercel.com/account/tokens com Scope na equipa dona do projecto e acesso a TODOS os projectos, sem restrição."
            exit 1
          fi

          falhou=0
          for par in "utilizador:$utilizador" "equipa:$equipa" "projecto:$projecto" "ambiente:$ambiente"; do
            nome=${par%%:*}; codigo=${par##*:}
            case "$codigo" in
              200) ;;
              401) echo "::error::[$nome] HTTP 401 — VERCEL_TOKEN inválido ou expirado. Tokens OAuth da CLI duram poucas horas; crie um em https://vercel.com/account/tokens."; falhou=1 ;;
              403) echo "::error::[$nome] HTTP 403 — o token não tem permissão para este recurso. Confirme que o Scope do token é a equipa dona do projecto."; falhou=1 ;;
              404) echo "::error::[$nome] HTTP 404 — recurso inexistente neste âmbito. Confirme VERCEL_ORG_ID e VERCEL_PROJECT_ID contra .vercel/repo.json."; falhou=1 ;;
              *)   echo "::error::[$nome] HTTP $codigo inesperado."; falhou=1 ;;
            esac
          done
          [ "$falhou" -eq 0 ] || exit 1
          echo "Credenciais válidas em todas as sondas."

      - name: Instalar a CLI do Vercel
        run: npm install --global vercel@latest

      - name: Obter a configuração de produção do Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilar os artefactos de produção
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar os artefactos pré-compilados
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado em $url" >> "$GITHUB_STEP_SUMMARY"
