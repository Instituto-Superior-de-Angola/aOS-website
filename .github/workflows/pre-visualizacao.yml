name: Pré-visualização

# Publica uma pré-visualização do website para cada Pull Request e devolve o
# endereço num comentário, para que a revisão seja feita sobre o site real e
# não apenas sobre o diff.
#
# Pull Requests vindos de forks não têm acesso aos segredos do repositório e
# são deliberadamente ignorados por este workflow.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pre-visualizacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-visualizar:
    name: Publicar pré-visualização
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validar credenciais do Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # O erro nativo do `vercel pull` ("Could not retrieve Project Settings")
          # não distingue um token em falta de um token com âmbito errado. Esta
          # verificação prévia diz exactamente o que está mal.
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Faltam segredos. Defina VERCEL_TOKEN, VERCEL_ORG_ID e VERCEL_PROJECT_ID no repositório."
            exit 1
          fi

          codigo=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")

          case "$codigo" in
            200)
              echo "Credenciais válidas: o token acede ao projecto $VERCEL_PROJECT_ID." ;;
            401)
              echo "::error::VERCEL_TOKEN inválido ou expirado. Tokens OAuth da CLI duram poucas horas — crie um token em https://vercel.com/account/tokens."
              exit 1 ;;
            403)
              echo "::error::O VERCEL_TOKEN não tem acesso ao âmbito $VERCEL_ORG_ID. Recrie o token em https://vercel.com/account/tokens escolhendo no selector Scope a equipa dona do projecto, e não a conta pessoal."
              exit 1 ;;
            404)
              echo "::error::Projecto $VERCEL_PROJECT_ID não encontrado no âmbito $VERCEL_ORG_ID. Confirme os valores em .vercel/repo.json (ou .vercel/project.json) após 'vercel link'."
              exit 1 ;;
            *)
              echo "::error::Resposta inesperada da API do Vercel (HTTP $codigo)."
              exit 1 ;;
          esac

      - name: Instalar a CLI do Vercel
        run: npm install --global vercel@latest

      - name: Obter a configuração de pré-visualização do Vercel
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilar os artefactos
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publicar os artefactos pré-compilados
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comentar o endereço no Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.publicar.outputs.url }}';
            const marca = '<!-- pre-visualizacao-aos -->';
            const corpo = `${marca}\n### 🔍 Pré-visualização publicada\n\nEste Pull Request está disponível em **${url}**\n\nCommit: \`${context.sha.slice(0, 7)}\``;

            const comentarios = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existente = comentarios.data.find((c) => c.body.includes(marca));

            if (existente) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existente.id,
                body: corpo,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: corpo,
              });
            }
